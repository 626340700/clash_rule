# 节点信息（只使用单行写法；默认注释，避免在 Sub-Store 中覆盖订阅节点）
# 独立 Mihomo 需要手动添加节点时：取消 proxies: 以及实际节点行前的 #。
# 手动节点写在下面空行处：每个节点占一行，前面 2 个空格再写 - {name: ...}。
#proxies:

#  - {name: "手动VLESS示例", type: vless, server: example.com, port: 443, uuid: "00000000-0000-0000-0000-000000000000", tls: true, servername: example.com}
#  - {name: "手动Trojan示例", type: trojan, server: example.com, port: 443, password: "replace-with-real-password", sni: example.com}

# 提醒：按照上面格式继续添加节点；仅取消实际使用节点的注释，并替换为真实参数。

# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
mode: rule
find-process-mode: 'off' #always/strict
# interface-name: en0
# global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

# 控制面板
# external-controller: 0.0.0.0:9090
# secret: "123456"  #控制面板密码
# external-ui: "/etc/mihomo/run/ui"
# external-ui-name: zashboard
# external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "rule-set:private_domain,cn_domain"
    - "dlg.io.mi.com"
    - "+.apple.com"
    - "+.wechat.com"
    - "+.wechatapp.com"
    - "+.qpic.cn"
    - "+.qq.com"
    - "+.vivox.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"   

# 入站  
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set:
    - "cn_ip"

# DNS模块：保持 Fake-IP、中国域名绕过；Sub-Store 两个域名获取真实 IP。
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.cn"
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "sub.rn.626340700.xyz"
    - "sub.sh.626340700.xyz"
    - "+.services.googleapis.cn"
    - "+.xn--ngstr-lra8j.com"
    - "time.*.com"
    - "+.pool.ntp.org"
    - "+.ntp.tencent.com"
    - "+.ntp1.aliyun.com"
    - "+.ntp.ntsc.ac.cn"
    - "+.cn.ntp.org.cn"
    - "+.duckdns.org"
    - "+.ddnsfree.com"

  # 引导 DNS：用于解析带域名的 DNS 上游服务器地址
  default-nameserver:
    - 218.4.4.4
    - 119.29.29.29

  # 节点服务器域名解析：避免依赖尚未建立的代理节点
  proxy-server-nameserver:
    - "218.4.4.4#DIRECT"
    - "119.29.29.29#DIRECT"

  # 国内域名国内解析；googleapis.cn 用国外 DoH，经过默认代理
  nameserver-policy:
    "+.googleapis.cn":
      - "https://1.1.1.1/dns-query#🚀 默认代理"
      - "https://8.8.8.8/dns-query#🚀 默认代理"

    "rule-set:cn_domain":
      - "218.4.4.4#DIRECT"
      - "119.29.29.29#DIRECT"

  # 其他未命中 policy 的 DNS 查询，通过默认代理使用国外 DoH
  nameserver:
    - "https://1.1.1.1/dns-query#🚀 默认代理"
    - "https://8.8.8.8/dns-query#🚀 默认代理"
# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
# [🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, TW 台湾节点, 🇺🇲 美国节点, ⚡ CN2, 🏠 ISP住宅, ✴️ claude, 🔗 中转节点, 🌐 全部节点, DIRECT]
pr: &pr {type: select, proxies: [🚀 默认代理, 🇺🇲 美国节点, ⚡ CN2, 🏠 ISP住宅, 🔗 中转节点, 🌐 全部节点, DIRECT]}
proxy-groups:
  - {name: 🚀 默认代理, type: select, proxies: [⚡ CN2, 🇺🇲 美国节点, 🏠 ISP住宅, 🔗 中转节点, 🌐 全部节点, DIRECT]}
#  - {name: 💻 OpenCode, <<: *pr}
  - {name: 📹 YouTube, <<: *pr}
  - {name: 🍀 Google, <<: *pr}
  - {name: "✴️ Claude", type: select, proxies: [🏠 ISP住宅, 🚀 默认代理, 🇺🇲 美国节点, ⚡ CN2, 🔗 中转节点, 🌐 全部节点, DIRECT]}
  - {name: 🤖 ChatGPT, type: select, proxies: [🏠 ISP住宅, 🚀 默认代理, 🇺🇲 美国节点, ⚡ CN2, 🔗 中转节点, 🌐 全部节点, DIRECT]}
  - {name: 🧠 AI, type: select, proxies: [🚀 默认代理, 🇺🇲 美国节点, ⚡ CN2, 🏠 ISP住宅, 🔗 中转节点, 🌐 全部节点, DIRECT]}
  - {name: 🅾️ Oracle, type: select, proxies: [🚀 默认代理, 🇺🇲 美国节点, ⚡ CN2, 🏠 ISP住宅, 🔗 中转节点, 🌐 全部节点, DIRECT]}
  - {name: 👨🏿‍💻 GitHub, <<: *pr}
#  - {name: 🐬 OneDrive, <<: *pr}
  - {name: 🪟 Microsoft, type: select, proxies: [DIRECT, 🚀 默认代理]}
#  - {name: 🎵 TikTok, <<: *pr}
  - {name: 📲 Telegram, <<: *pr}
  - {name: 🟢 WhatsApp, <<: *pr}
#  - {name: 🎥 NETFLIX, <<: *pr}
#  - {name: ✈️ Speedtest, <<: *pr}
#  - {name: 💶 PayPal, <<: *pr}
  - {name: 🍎 Apple, type: select, proxies: [DIRECT, 🚀 默认代理]}
  - {name: 🎯 直连, type: select, proxies: [DIRECT]}
  - {name: 🐟 漏网之鱼, <<: *pr}
#  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?i)港|hk|hongkong|hong kong", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
#  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?i)日|jp|japan", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
#  - {name: 🇸🇬 狮城节点, type: select, include-all: true, filter: "(?i)新加坡|坡|狮城|SG|Singapore", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
#  - {name: TW 台湾节点, type: select, include-all: true, filter: "(?i)台|台湾|台北|新北|彰化|TW|Taiwan", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
  #- {name: 🇰🇷 韩国节点, type: select, include-all: true, filter: "(?i)KR|Korea|KOR|首尔|韩|韓", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
  - {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?i)美|us|unitedstates|united states", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
  # 只匹配原配置的两个 CN2 节点，不包含 ISP、住宅或中转节点。
  - {name: ⚡ CN2, type: select, include-all: true, filter: "^US_CN2_(VLESS|TUIC)$"}
  - {name: 🏠 ISP住宅, type: select, include-all: true, filter: "(?i)ISP|住宅|家宽|RESIP|美国 *AT", exclude-filter: "(?i)中转|relay"}
  - {name: 🔗 中转节点, type: select, include-all: true, filter: "(?i)中转|relay"}
  - {name: 🌐 全部节点, type: select, include-all: true}

# 规则匹配
# 优先保护 Claude 本体、身份核验、支付与已知监控；普通共享依赖不单独强制路由。
# 第三方共享域名被其他网站使用时也可能命中 ISP（如 Stripe、Statsig、Sentry）。
rules:
  # Sub-Store 管理/下载域名优先直连，不依赖代理节点
  - DOMAIN,sub.rn.626340700.xyz,DIRECT
  # 以下四套 Claude 规则统一进入“✴️ Claude”，再由其选择 ISP 或其他代理组
  - RULE-SET,anthropic_official,✴️ Claude
  - RULE-SET,claude_community,✴️ Claude
  - RULE-SET,stripe_services,✴️ Claude
  - RULE-SET,claude_extra,✴️ Claude
  # ClaudeExtra.list 自带 DOMAIN-KEYWORD,claude / anthropic，无须重复写在本 YAML

  # ChatGPT 和其他 AI 保持独立手选策略组
#  - DOMAIN-SUFFIX,opencode.ai,💻 OpenCode
  - RULE-SET,openai,🤖 ChatGPT
  - RULE-SET,ai,🧠 AI

  # 原有常规分流；GitHub 仍由原 GitHub 策略组处理（其首选是默认代理）
  - RULE-SET,proxyWE,🚀 默认代理
  - RULE-SET,Directlite,DIRECT
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,apple,🍎 Apple
  - RULE-SET,proxylite,🚀 默认代理
  - RULE-SET,github,👨🏿‍💻 GitHub
  - RULE-SET,youtube,📹 YouTube
  - RULE-SET,google,🍀 Google
  - RULE-SET,oracle,🅾️ Oracle
  #- RULE-SET,onedrive,🐬 OneDrive
  - RULE-SET,microsoft,🪟 Microsoft
  #- RULE-SET,tiktok,🎵 TikTok
  #- RULE-SET,speedtest_domain,✈️ Speedtest
  - RULE-SET,telegram,📲 Telegram
  - RULE-SET,whatsapp,🟢 WhatsApp
  #- RULE-SET,netflix_domain,🎥 NETFLIX
  #- RULE-SET,paypal_domain,💶 PayPal
  - RULE-SET,gfw,🚀 默认代理
  - RULE-SET,geolocation-!cn,🚀 默认代理
  - RULE-SET,cn_domain,🎯 直连
  - RULE-SET,google_ip,🍀 Google,no-resolve
  #- RULE-SET,netflix_ip,🎥 NETFLIX,no-resolve
  - RULE-SET,telegram_ip,📲 Telegram,no-resolve
  - RULE-SET,cn_ip,🎯 直连,no-resolve
  - MATCH,🐟 漏网之鱼

# 规则集
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}
rule-providers:
  # 上游主源：MetaCubeX；每天检查更新
  anthropic_official: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/anthropic.mrs"}
  stripe_services: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/stripe.mrs"}
  # 社区 YAML，覆盖锚点原本的 MRS 格式
  claude_community: {<<: *domain, format: yaml, url: "https://raw.githubusercontent.com/uhovohu/clash/refs/heads/main/Rules/anthropic.yaml"}
  # 用户自己 GitHub 上的 classical/text 补充规则，包含 Claude/Anthropic 关键词兜底
  claude_extra: {<<: *class, url: "https://raw.githubusercontent.com/626340700/clash_rule/refs/heads/main/ClaudeExtra.list"}
  # claude_shared 未启用；通用下载和 CDN 保持原有分流规则
