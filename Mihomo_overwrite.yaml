# Mihomo 共用配置｜Sub-Store 覆写 / 直接导入 Mihomo
# ================================================================
# 【模式 A：Sub-Store（默认）】
#   1. 保持下方 proxy-providers 和 proxies 两部分全部注释。
#   2. 在 Sub-Store 的「mihomo 配置文件」中选择已有订阅/组合订阅作来源，再使用本文件覆写。
#   3. Sub-Store 提供节点；本模板只负责 DNS / 分组 / 规则等配置。
#
# 【模式 B：独立 Mihomo / Nikki / OpenClash 配置】
#   1. 取消注释「proxy-providers:」和需要启用的订阅块，填入真实 URL。
#   2. 如果要添加手动节点，再取消注释「proxies:」，在其下填写真实节点。
#   3. 可以只使用订阅，也可以只使用手动节点，或者两者一起使用。
#   4. include-all: true 的节点组会自动收集所有代理和代理集合，不用改分流规则。
#
# 注意：proxy-providers 中的 proxy: DIRECT 只表示“订阅更新直连下载”。
#       DIRECT 是 Mihomo 内置直连；无需创建额外的“直连”节点。
#       “🎯 直连”是原有分流策略组，保留名称及原来的规则引用。
#       无需添加 {name: 直连, type: direct}，由 Mihomo 内置 DIRECT 负责直连。
#       需要添加 VLESS / TUIC 等真实手动节点时，使用下面的注释范例。
# ================================================================

# 订阅提供者：Sub-Store 覆写时保持注释；独立 Mihomo 模式才取消注释。
# 重要：只取消注释实际要用的订阅块；未配置订阅 URL 的块继续保持注释。
