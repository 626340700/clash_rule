# 必读！！！
# 此配置为覆写配置模板，不含节点以及订阅配置，不知道用途的不要用。
# 机场订阅

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed   ##如果内核版本大于v1.19.31，此处可以改为自研协议栈 mips ，理论上性能更好。
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
 
# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
# [🚀 默认代理, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, TW 台湾节点, 🇺🇲 美国节点, ⚡ CN2, 🏠 ISP住宅, ✴️ claude, 🔗 中转节点, 🌐 全部节点, 直连]
pr: &pr {type: select, proxies: [🚀 默认代理, 🇺🇲 美国节点, ⚡ CN2, 🏠 ISP住宅, ✴️ claude, 🔗 中转节点, 🌐 全部节点, 直连]}
proxy-groups:
  - {name: 🚀 默认代理, type: select, proxies: [🇺🇲 美国节点, ⚡ CN2, 🏠 ISP住宅, 🔗 中转节点, 🌐 全部节点, 直连]}
  - {name: 💻 OpenCode, <<: *pr}
  - {name: 📹 YouTube, <<: *pr}
  - {name: 🍀 Google, <<: *pr}
  - {name: 🤖 ChatGPT, <<: *pr}
  - {name: 🧠 AI, <<: *pr}
  - {name: 🅾️ Oracle, type: select, proxies: [🚀 默认代理, 🇺🇲 美国节点, ⚡ CN2, 🏠 ISP住宅, 🔗 中转节点, 🌐 全部节点, 直连]}
  - {name: 👨🏿‍💻 GitHub, <<: *pr}
#  - {name: 🐬 OneDrive, <<: *pr}
  - {name: 🪟 Microsoft, type: select, proxies: [直连, 🚀 默认代理]}
#  - {name: 🎵 TikTok, <<: *pr}
  - {name: 📲 Telegram, <<: *pr}
  - {name: 🟢 WhatsApp, <<: *pr}
#  - {name: 🎥 NETFLIX, <<: *pr}
#  - {name: ✈️ Speedtest, <<: *pr}
#  - {name: 💶 PayPal, <<: *pr}
  - {name: 🍎 Apple, type: select, proxies: [直连, 🚀 默认代理]}
  - {name: 🎯 直连, type: select, proxies: [直连, 🚀 默认代理]}
  - {name: 🐟 漏网之鱼, <<: *pr}
#  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?i)港|hk|hongkong|hong kong", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
#  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?i)日|jp|japan", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
#  - {name: 🇸🇬 狮城节点, type: select, include-all: true, filter: "(?i)新加坡|坡|狮城|SG|Singapore", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
#  - {name: TW 台湾节点, type: select, include-all: true, filter: "(?i)台|台湾|台北|新北|彰化|TW|Taiwan", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
  #- {name: 🇰🇷 韩国节点, type: select, include-all: true, filter: "(?i)KR|Korea|KOR|首尔|韩|韓", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
  - {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?i)美|us|unitedstates|united states", exclude-filter: "(?i)中转|relay|ISP|住宅|家宽|RESIP|美国 *AT"}
  # 只匹配截图中的两个节点，不包含 ISP、住宅或中转节点。
  - {name: ⚡ CN2, type: select, include-all: true, filter: "^US_CN2_(VLESS|TUIC)$"}
  - {name: 🏠 ISP住宅, type: select, include-all: true, filter: "(?i)ISP|住宅|家宽|RESIP|美国 *AT", exclude-filter: "(?i)中转|relay"}
  - {name: ✴️ claude, type: select, include-all: true, filter: "(?i)ISP|住宅|家宽|RESIP|美国 *AT", exclude-filter: "(?i)中转|relay"}
  - {name: 🔗 中转节点, type: select, include-all: true, filter: "(?i)中转|relay"}
  - {name: 🌐 全部节点, type: select, include-all: true}

